server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: Event_Ticket_Booking
  datasource:
    hikari:
      connection-init-sql: "SET lock_timeout = '5s'"
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  file:
    name: ${LOG_FILE:logs/application.log}
  structured:
    json:
      exclude: thread_name,level_value
    format:
      file: logstash

app:
  jwt:
    # No default on purpose: the app refuses to start without JWT_SECRET (needs at least 32 bytes)
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}