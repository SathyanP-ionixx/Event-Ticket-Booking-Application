spring:
  application:
    name: Event_Ticket_Booking
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
management:
    endpoints:
      health:
      show-details: always
      web:
        exposure:
          include: health
logging:
  file:
    name: application.log

  # JSON, one object per line, in the "logstash" layout built into Spring Boot
  # (@timestamp, @version, message, logger_name, thread_name, level, level_value, then MDC fields)
  structured:
    format:
      file: logstash

  # file only: switch the console appender off (property needs Spring Boot 3.5+, ignored on older versions)
  threshold:
    console:off
