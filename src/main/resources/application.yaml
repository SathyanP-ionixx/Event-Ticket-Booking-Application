spring:
  application:
    name: Event_Ticket_Booking
  datasource:
    url: jdbc:postgresql://localhost:5432/Event_Ticket_Booking_DB
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
management:
    endpoints:
      health:
      show-details: always
      web:
        exposure:
          include: health
logging:
  file:
    name: logs/application.log

  # JSON, one object per line, in the "logstash" layout built into Spring Boot
  # (@timestamp, @version, message, logger_name, thread_name, level, level_value, then MDC fields)
  structured:
    json:
      exclude: thread_name,level_value
    format:
      file: logstash

  # file only: switch the console appender off (property needs Spring Boot 3.5+, ignored on older versions)
  threshold:
    console:off

app:
  jwt:
    # >= 32 bytes. Set JWT_SECRET in every real environment; the fallback is for local development only.
    secret: ${JWT_SECRET_BASE64}
    expiration-minutes: 60
