databaseChangeLog:
  - changeSet:
      id: 1-create-events-table
      author: IO165
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_events
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: category
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: base_price
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false

              - column:
                  name: total_seats
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: event_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: venue
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: events
            columnNames: name, event_date
            constraintName: uk_event_name_date